name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Lua syntax + AI simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu archive is occasionally unreachable from runners ("Temporary failure
      # resolving azure.archive.ubuntu.com"), so retry apt and fall back to building 5.1.5
      # from source. Nothing here depends on a specific distro package.
      - name: Install Lua 5.1
        timeout-minutes: 15
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
               && sudo apt-get install -y -o Acquire::Retries=3 lua5.1; then
              installed=1
              echo "lua5.1 installed from apt"
              break
            fi
            echo "::warning::apt attempt $attempt failed"
            sleep 10
          done
          if [ "$installed" -eq 0 ]; then
            echo "::warning::apt could not install lua5.1, building Lua 5.1.5 from source"
            # LuaDist mirrors the official 5.1.5 tree; it ships the unmodified luaconf.h
            # as luaconf.h.orig for its own templating, so restore it before building.
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              -o /tmp/lua-5.1.5.tar.gz \
              https://github.com/LuaDist/lua/archive/refs/tags/5.1.5.tar.gz
            tar -xzf /tmp/lua-5.1.5.tar.gz -C /tmp
            cp /tmp/lua-5.1.5/src/luaconf.h.orig /tmp/lua-5.1.5/src/luaconf.h
            make -C /tmp/lua-5.1.5 generic
            sudo make -C /tmp/lua-5.1.5 install
          fi
          lua -v 2>&1 || lua5.1 -v
          luac -v 2>&1 || luac5.1 -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness
        run: python tools/harness/run.py

  webgui:
    name: Web GUI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        shell: bash
        run: |
          if [ ! -d webgui ]; then echo "webgui/ not in repo, skipping"; exit 0; fi
          find webgui -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  gui:
    name: Build config GUI (.NET 4.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: .\tools\gui.ps1 -Action Build -Configuration Release
      - name: Package
        run: |
          $pkgRoot = "$env:RUNNER_TEMP\pkg"
          $pkg = "$pkgRoot\USER_AI"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item USER_AI\* $pkg -Recurse -Exclude *.pdb
          Copy-Item ".artifacts\gui\Release\AzzyAIConfig.exe" $pkg -Force
          Copy-Item docs "$pkgRoot\docs" -Recurse
          Copy-Item LICENSES "$pkgRoot\LICENSES" -Recurse
          Copy-Item README.md, README.pt-BR.md, README.es.md, Changelog.md, NOTICE.md, SECURITY.md, CONTRIBUTING.md $pkgRoot
          Compress-Archive -Path "$pkgRoot\*" -DestinationPath AzzyAI.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AzzyAI
          path: AzzyAI.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lua, webgui, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AzzyAI
      - uses: softprops/action-gh-release@v2
        with:
          files: AzzyAI.zip
          generate_release_notes: true
