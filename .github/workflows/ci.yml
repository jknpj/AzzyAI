name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Lua syntax + AI simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build 5.1.5 from source first: it is deterministic and independent of the Ubuntu
      # mirrors, which are occasionally unreachable from runners ("Temporary failure
      # resolving azure.archive.ubuntu.com"). apt stays as a fallback, but every apt call
      # is wrapped in `timeout` so an unreachable mirror can never eat the whole step.
      - name: Install Lua 5.1
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf /tmp/lua-5.1.5
          # LuaDist mirrors the official 5.1.5 tree; its archive ships the unmodified
          # header as luaconf.h.orig for its own templating, so restore it first.
          if curl -fsSL --connect-timeout 15 --max-time 300 --retry 3 --retry-delay 2 \
               -o /tmp/lua-5.1.5.tar.gz \
               https://github.com/LuaDist/lua/archive/refs/tags/5.1.5.tar.gz \
             && tar -xzf /tmp/lua-5.1.5.tar.gz -C /tmp \
             && cp /tmp/lua-5.1.5/src/luaconf.h.orig /tmp/lua-5.1.5/src/luaconf.h \
             && make -C /tmp/lua-5.1.5 generic \
             && sudo make -C /tmp/lua-5.1.5 install; then
            echo "Lua 5.1.5 built from source"
          else
            echo "::warning::source build failed, trying apt with a hard timeout"
            timeout 240 sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 || true
            timeout 240 sudo apt-get install -y -o Acquire::Retries=1 lua5.1
          fi
          lua -v 2>&1 || lua5.1 -v
          luac -v 2>&1 || luac5.1 -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness
        run: python tools/harness/run.py

  webgui:
    name: Web GUI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        shell: bash
        run: |
          if [ ! -d webgui ]; then echo "webgui/ not in repo, skipping"; exit 0; fi
          find webgui -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Embedded config templates match the shipped preset
        shell: bash
        run: |
          if [ ! -d webgui ]; then echo "webgui/ not in repo, skipping"; exit 0; fi
          node tools/webgui_templates_check.js
          node tools/webgui-data.js --check
      - name: No generated editor files are tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.lua.new' '*.new' 'tools/azzy-native/azzy-native.log')"
          if [ -n "$tracked" ]; then
            echo "::error::generated files must not be committed:"
            printf '%s\n' "$tracked"
            exit 1
          fi

  gui:
    name: Build config GUI (.NET 4.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: .\tools\gui.ps1 -Action Build -Configuration Release
      # the commit job below needs only the binary, not the whole ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: AzzyAIConfig.exe
          path: .artifacts/gui/Release/AzzyAIConfig.exe
          if-no-files-found: error
      - name: Package
        run: |
          $pkgRoot = "$env:RUNNER_TEMP\pkg"
          $pkg = "$pkgRoot\USER_AI"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item USER_AI\* $pkg -Recurse -Exclude *.pdb
          Copy-Item ".artifacts\gui\Release\AzzyAIConfig.exe" $pkg -Force
          Copy-Item docs "$pkgRoot\docs" -Recurse
          Copy-Item LICENSES "$pkgRoot\LICENSES" -Recurse
          # browser configuration tool: static files, works from file:// or any host
          Copy-Item webgui "$pkgRoot\webgui" -Recurse
          Remove-Item "$pkgRoot\webgui\.git" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$pkgRoot\webgui\.github" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item README.md, README.pt-BR.md, README.es.md, CHANGELOG.md, NOTICE.md, SECURITY.md, CONTRIBUTING.md $pkgRoot
          Compress-Archive -Path "$pkgRoot\*" -DestinationPath AzzyAI.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AzzyAI
          path: AzzyAI.zip

  gui-rust:
    name: Build azzy-gui (Rust, spike)
    # branch spike/gui-rust: builds the local host so it can be tested without a Rust toolchain
    if: github.ref == 'refs/heads/spike/gui-rust'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - name: Test
        run: cargo test -p azzy-config -p azzy-gui -p azzy-native --manifest-path tools/Cargo.toml
      - name: Build
        run: cargo build --release -p azzy-gui -p azzy-native --manifest-path tools/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: azzy-gui
          path: tools/target/release/azzy-gui.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: azzy-native
          path: tools/target/release/azzy-native.exe
          if-no-files-found: error

  commit-gui-rust:
    name: Commit azzy-gui.exe on the spike branch
    # so testing the host is a plain `git pull`: the artifact is committed on the branch, the same
    # way commit-gui keeps USER_AI/AzzyAIConfig.exe current on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/spike/gui-rust'
    needs: [gui-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: commit-gui-rust-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azzy-gui
          path: .artifacts
      - uses: actions/download-artifact@v4
        with:
          name: azzy-native
          path: .artifacts
      - name: Commit the Windows binaries when the build differs
        run: |
          set -euo pipefail
          test -f .artifacts/azzy-gui.exe || { echo "::error::the azzy-gui artifact is missing"; exit 1; }
          test -f .artifacts/azzy-native.exe || { echo "::error::the azzy-native artifact is missing"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another push can land between checkout and here, and rebasing two different builds of a
          # binary conflicts; rebuild the commit from the current tip on every attempt instead.
          for attempt in 1 2 3; do
            git fetch -q origin spike/gui-rust
            git reset -q --hard FETCH_HEAD
            cp .artifacts/azzy-gui.exe tools/azzy-gui/azzy-gui.exe
            cp .artifacts/azzy-native.exe tools/azzy-native/azzy-native.exe
            if [ -z "$(git status --porcelain -- tools/azzy-gui/azzy-gui.exe tools/azzy-native/azzy-native.exe)" ]; then
              echo "both Windows binaries already match the build"
              exit 0
            fi
            git add tools/azzy-gui/azzy-gui.exe tools/azzy-native/azzy-native.exe
            git commit -q -m "build: refresh the Windows binaries from CI [skip ci]"
            if git push origin HEAD:spike/gui-rust; then exit 0; fi
            echo "push rejected, retrying from the new tip"
          done
          echo "::error::could not push the refreshed binaries"
          exit 1

  commit-gui:
    name: Refresh the committed GUI
    # only real pushes to main: PRs and tags build but do not write back
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: commit-gui-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AzzyAIConfig.exe
          path: .artifacts/gui
      - name: Commit USER_AI/AzzyAIConfig.exe when the build differs
        run: |
          set -euo pipefail
          built=.artifacts/gui/AzzyAIConfig.exe
          test -f "$built" || { echo "::error::the GUI artifact is missing"; exit 1; }
          cp "$built" USER_AI/AzzyAIConfig.exe
          if git diff --quiet -- USER_AI/AzzyAIConfig.exe; then
            echo "USER_AI/AzzyAIConfig.exe already matches the build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USER_AI/AzzyAIConfig.exe
          # [skip ci] stops this commit from starting another run; the diff check above stops it
          # from looping even if that marker is ever ignored
          git commit -q -m "build: refresh the committed GUI from CI [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push the refreshed GUI (branch protection?)"
          exit 1

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lua, webgui, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # use the matching "## <version>" section of CHANGELOG.md as the release body
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" 'p && /^## / { exit } $0 == heading { p = 1; next } p' CHANGELOG.md | sed '/./,$!d' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "CHANGELOG.md has no '$version' section" >&2
            exit 1
          fi
          cat release-body.md
      - uses: actions/download-artifact@v4
        with:
          name: AzzyAI
      - uses: softprops/action-gh-release@v2
        with:
          files: AzzyAI.zip
          body_path: release-body.md
