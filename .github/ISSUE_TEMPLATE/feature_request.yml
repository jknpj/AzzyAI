name: Suggestion
description: An idea for a new option, behavior or doc improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like it to do?
      description: Describe the situation in game, not only the solution. For example "Dieter keeps casting Lava Slide at Fire monsters".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? An option name and a default value help.
  - type: dropdown
    id: unit
    attributes:
      label: Who is it for?
      options:
        - Homunculus
        - Mercenary
        - Configuration tools
        - Documentation
        - Everyone
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test it in game and report back.
        - label: I can send a pull request.
