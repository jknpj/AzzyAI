[package]
name = "azzy-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prototype of the AzzyAI configuration GUI in Rust (egui)"

[[bin]]
name = "azzy-native"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
serde_json = "1"
azzy-config = { path = "../azzy-config" }
azzy-update = { path = "../azzy-update" }
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
