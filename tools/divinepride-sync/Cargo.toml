[package]
name = "divinepride-sync"
version = "0.1.0"
edition = "2021"
description = "Downloads the homunculus skill data AzzyAI uses from the Divine Pride API"
license = "GPL-3.0-or-later"

[[bin]]
name = "divinepride-sync"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde_json = "1"

[profile.release]
lto = true
strip = true
